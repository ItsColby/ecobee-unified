resume_program:
  name: Resume program
  description: Press the mapped HomeKit Clear Hold button once. A successful call is recorded as submitted; Ecobee Unified cannot confirm schedule resumption from source state.
  target:
    entity:
      integration: ecobee_unified
      domain: climate

create_vacation:
  name: Create Ecobee vacation
  description: Send a vacation definition to the mapped Ecobee climate. A successful call is recorded as submitted, without confirming the saved definition. Omitted date/time pairs are left for the Ecobee integration to interpret.
  target:
    entity:
      integration: ecobee_unified
      domain: climate
  fields:
    vacation_name:
      name: Vacation name
      description: Name of 1 to 12 characters after trimming surrounding spaces. Ecobee Unified does not check for an existing vacation with this name.
      required: true
      selector:
        text:
    cool_temp:
      name: Cooling temperature
      description: Cooling target within the mapped Ecobee climate's reported bounds, in that climate's temperature unit. It must be at or above the heating target.
      required: true
      selector:
        number:
          step: 0.5
          unit_of_measurement: "°"
    heat_temp:
      name: Heating temperature
      description: Heating target within the mapped Ecobee climate's reported bounds, in that climate's temperature unit. It must be at or below the cooling target.
      required: true
      selector:
        number:
          step: 0.5
          unit_of_measurement: "°"
    start_date:
      name: Start date
      description: Optional start date in YYYY-MM-DD format. Supply Start time with it; the pair is forwarded to Ecobee without timezone conversion.
      selector:
        date:
    start_time:
      name: Start time
      description: Optional start time in HH:MM:SS format. Supply Start date with it; omit both to leave the start unspecified.
      selector:
        time:
    end_date:
      name: End date
      description: Optional end date in YYYY-MM-DD format. Supply End time with it; when both start and end are supplied, the end must be later.
      selector:
        date:
    end_time:
      name: End time
      description: Optional end time in HH:MM:SS format. Supply End date with it; omit both to leave the end unspecified.
      selector:
        time:
    fan_mode:
      name: Fan mode
      description: Ecobee vacation fan setting. Use auto for automatic operation or on for continuous operation; the default is auto.
      default: auto
      selector:
        select:
          options:
            - auto
            - "on"
    fan_min_on_time:
      name: Minimum fan runtime
      description: Vacation minimum fan minutes per hour, from 0 to 60 in whole minutes; the default is 0. This action field has a one-minute step.
      default: 0
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: min

delete_vacation:
  name: Delete Ecobee vacation
  description: Send a request to delete the named vacation from the mapped Ecobee climate. A successful call is recorded as submitted; removal is not confirmed from source state.
  target:
    entity:
      integration: ecobee_unified
      domain: climate
  fields:
    vacation_name:
      name: Vacation name
      description: Existing vacation name to send to Ecobee, containing 1 to 12 characters after trimming surrounding spaces.
      required: true
      selector:
        text:

set_occupancy_modes:
  name: Set Ecobee occupancy policy
  description: Send Smart Home/Away, Follow Me, or both settings to the mapped Ecobee climate. Supply at least one field. A successful call is recorded as submitted; the policy change is not confirmed from source state.
  target:
    entity:
      integration: ecobee_unified
      domain: climate
  fields:
    auto_away:
      name: Smart Home/Away
      description: Set Ecobee Smart Home/Away to enabled or disabled. Omit this field to leave its setting out of the request.
      selector:
        boolean:
    follow_me:
      name: Follow Me
      description: Set Ecobee Follow Me to enabled or disabled. Omit this field to leave its setting out of the request.
      selector:
        boolean:

set_sensors_used_in_climate:
  name: Set Ecobee comfort sensors
  description: Send sensor participation for a comfort profile to the mapped Ecobee climate. Device validation checks the Ecobee integration entry, not attachment to this thermostat. A successful call is recorded as submitted; the resulting participation is not confirmed from source state.
  target:
    entity:
      integration: ecobee_unified
      domain: climate
  fields:
    preset_mode:
      name: Comfort profile
      description: Ecobee comfort profile name, from 1 to 64 characters. Omit this field to use the current profile reported by Ecobee; if that profile is unavailable, provide a name.
      selector:
        text:
    device_ids:
      name: Ecobee sensor devices
      description: Select 1 to 32 distinct Ecobee devices from the same integration entry as the mapped climate. Choose the thermostat or sensor devices intended for this comfort profile.
      required: true
      selector:
        device:
          multiple: true
          integration: ecobee
          entity:
            - domain: climate
            - domain: sensor
