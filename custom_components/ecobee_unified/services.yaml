resume_program:
  name: Resume program
  description: "Request schedule resumption by pressing the mapped HomeKit Clear Hold button once. The button must belong to the HomeKit thermostat and pass role checks; verify its actual purpose when mapping it. A successful service return records submitted, without proving that a hold ended or which schedule resumed. After an error or interrupted call, inspect the thermostat before repeating the request."
  target:
    entity:
      integration: ecobee_unified
      domain: climate

create_vacation:
  name: Create Ecobee vacation
  description: "Send one vacation request through the mapped Ecobee climate. It requires matching thermostat identity, a fresh usable Ecobee source, and the native vacation service. A successful return records submitted; the created vacation is not observed here. Review the vacation in Ecobee, especially before repeating a request after an error, cancellation, or integration reload."
  target:
    entity:
      integration: ecobee_unified
      domain: climate
  fields:
    vacation_name:
      name: Vacation name
      description: "Name for this vacation, containing 1–12 characters after surrounding spaces are removed. Use this name when requesting deletion. Ecobee Unified does not inspect existing vacations for name collisions."
      required: true
      selector:
        text:
    cool_temp:
      name: Cooling temperature
      description: "Vacation cooling target in Home Assistant’s configured temperature unit, within the mapped Ecobee climate’s reported limits. It must be at or above the heating target."
      required: true
      selector:
        number:
          step: 0.5
          unit_of_measurement: "°"
    heat_temp:
      name: Heating temperature
      description: "Vacation heating target in Home Assistant’s configured temperature unit, within the mapped Ecobee climate’s reported limits. It must be at or below the cooling target."
      required: true
      selector:
        number:
          step: 0.5
          unit_of_measurement: "°"
    start_date:
      name: Start date
      description: "Start date in YYYY-MM-DD form. Supply start_time with it, or omit both to leave the start to the native Ecobee action."
      selector:
        date:
    start_time:
      name: Start time
      description: "Start time in HH:MM:SS form, paired with start_date. The pair is passed unchanged to the native Ecobee action; Ecobee Unified performs no time-zone conversion."
      selector:
        time:
    end_date:
      name: End date
      description: "End date in YYYY-MM-DD form. Supply end_time with it, or omit both to leave the end to the native Ecobee action. A fully specified end must follow the start."
      selector:
        date:
    end_time:
      name: End time
      description: "End time in HH:MM:SS form, paired with end_date. The pair is passed unchanged to the native Ecobee action; Ecobee Unified performs no time-zone conversion."
      selector:
        time:
    fan_mode:
      name: Fan mode
      description: "Fan mode to include in the vacation request: auto or on. The default is auto."
      default: auto
      selector:
        select:
          options:
            - auto
            - "on"
    fan_min_on_time:
      name: Minimum fan runtime
      description: "Vacation minimum fan runtime in minutes per hour, from 0 to 60 in whole minutes. The default is 0."
      default: 0
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: min

delete_vacation:
  name: Delete Ecobee vacation
  description: "Send one deletion request for a named vacation through the mapped Ecobee climate. The source must be fresh, its thermostat identity must match HomeKit, and the native deletion service must be available. A successful return records submitted; check Ecobee to establish that the vacation is gone before repeating an uncertain request."
  target:
    entity:
      integration: ecobee_unified
      domain: climate
  fields:
    vacation_name:
      name: Vacation name
      description: "Existing vacation name, containing 1–12 characters after surrounding spaces are removed. The trimmed name is sent to Ecobee."
      required: true
      selector:
        text:

set_occupancy_modes:
  name: Set Ecobee occupancy policy
  description: "Request changes to Smart Home/Away, Follow Me, or both through the mapped Ecobee climate. Supply at least one policy. The source must be fresh, match the HomeKit thermostat, and support the native service. A successful return records submitted; verify the policy settings in Ecobee because their resulting values are not observed here."
  target:
    entity:
      integration: ecobee_unified
      domain: climate
  fields:
    auto_away:
      name: Smart Home/Away
      description: "Set Smart Home/Away to true or false. Omit this field to leave that policy untouched."
      selector:
        boolean:
    follow_me:
      name: Follow Me
      description: "Set Follow Me to true or false. Omit this field to leave that policy untouched."
      selector:
        boolean:

set_sensors_used_in_climate:
  name: Set Ecobee comfort sensors
  description: "Request sensor participation for one Ecobee comfort profile. The mapped Ecobee source must be fresh, match the HomeKit thermostat, and support the native service. A successful return records submitted; inspect the profile in Ecobee to verify the selection. Reported comfort-sensor lists do not establish current physical occupancy or each sensor’s temperature contribution."
  target:
    entity:
      integration: ecobee_unified
      domain: climate
  fields:
    preset_mode:
      name: Comfort profile
      description: "Profile to change, up to 64 characters after trimming. Home, Away, and Sleep are normalized to those names; custom names retain their case. If omitted, the current climate_mode reported by Ecobee is required and used."
      selector:
        text:
    device_ids:
      name: Ecobee sensor devices
      description: "Select 1–32 distinct Home Assistant devices from the same Ecobee integration entry as the mapped thermostat. The thermostat device itself can be included. Select the devices intended for this profile; the membership check establishes their integration association."
      required: true
      selector:
        device:
          multiple: true
          integration: ecobee
          entity:
            - domain: climate
            - domain: sensor
